<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中壢分校年度課程行事曆</title>
<style>
  :root {
    --paper:#eff3f0; --card:#fff; --ink:#16211d; --dim:#5c6b64; --faint:#93a29b; --line:#dbe3de; --soft:#e7ece9;
    --shadow:0 1px 2px rgba(22,33,29,.05),0 4px 20px rgba(22,33,29,.05);
    --g-night:#fbe3cf; --g-day:#d6e6f0; --g-noon:#d9ecd9; --g-hol:#f4d9e4;
    --today:#f2c200; --today-ink:#3d3000; --today-bg:rgba(255,221,64,.22); --today-flash:rgba(255,214,0,.55);
    --grid:rgba(140,150,145,.22); --room:#e4def0;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --paper:#121614; --card:#1a201d; --ink:#e7ece9; --dim:#9aa8a1; --faint:#5f6d67; --line:#2a332e; --soft:#212a26;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 20px rgba(0,0,0,.35);
    --g-night:#3a2c20; --g-day:#1f2f3a; --g-noon:#233326; --g-hol:#3a2530;
    --today:#e0b400; --today-ink:#1a1400; --today-bg:rgba(240,200,40,.14); --today-flash:rgba(240,200,40,.4);
    --room:#2c2838; } }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 16px 60px; background:var(--paper); color:var(--ink);
    font-family:"Noto Sans TC","Microsoft JhengHei",-apple-system,sans-serif; line-height:1.45; }
  .wrap { max-width:1500px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr); gap:14px; }
  h1 { text-align:center; margin:0 0 2px; font-size:clamp(1.4rem,4vw,1.9rem); font-weight:700; }
  .sub { text-align:center; color:var(--dim); font-size:.85rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); min-width:0; }
  .bar { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; margin-bottom:10px; }
  button, select, input[type=search] { font-family:inherit; font-size:.82rem; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:5px 10px; }
  button { cursor:pointer; }
  .months { display:flex; gap:4px; flex-wrap:wrap; }
  .years { display:flex; gap:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .years a { padding:5px 12px; font-size:.82rem; color:var(--ink); text-decoration:none; background:var(--card); }
  .years a + a { border-left:1px solid var(--line); }
  .years a.cur { background:var(--ink); color:var(--card); font-weight:700; }
  .years a:not(.cur):hover { background:var(--soft); }
  .months button { padding:4px 9px; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:.76rem; color:var(--dim); margin-left:auto; }
  .legend i { display:inline-block; width:11px; height:11px; border-radius:3px; vertical-align:-1px; margin-right:4px; }
  .scroller { overflow:auto; max-height:78vh; border:1px solid var(--line); border-radius:10px; background:var(--card); }
  .inner { position:relative; }
  .row { display:flex; }
  .lab { position:sticky; left:0; z-index:5; flex:0 0 var(--labw); width:var(--labw); border-right:2px solid var(--line); border-bottom:1px solid var(--line);
    padding:4px 8px; font-size:.78rem; font-weight:600; display:flex; align-items:center; }
  .track { position:relative; border-bottom:1px solid var(--line); flex:0 0 auto; }
  .hdr .lab, .hdr .track { position:sticky; z-index:6; background:var(--card); }
  .hdr .track { border-bottom:0; }
  .hrow { position:sticky; z-index:7; background:var(--card); display:flex; }
  .hrow .lab { z-index:8; background:var(--card); }
  .mon { position:absolute; top:0; height:22px; line-height:22px; text-align:center; font-size:.78rem; font-weight:700; color:#16211d; border-right:1px solid rgba(0,0,0,.12); }
  /* 左側合併標籤：時段 → 教室 → 課程列 */
  .sblock { display:flex; border-top:3px solid var(--ink); }
  /* 表頭下方粗黑線：放在固定的「備註」列底部，捲動時不會跑掉 */
  #inner > .hrow:nth-child(4) { box-shadow:0 3px 0 var(--ink); }
  #inner > .hrow + .sblock { border-top:3px solid transparent; }
  .slab { position:sticky; left:0; z-index:5; flex:0 0 58px; display:flex; align-items:center; justify-content:center;
    text-align:center; line-height:1.35; font-size:.82rem; font-weight:700; border-right:1px solid var(--line); }
  .rcol { display:flex; flex-direction:column; }
  .rblock { display:flex; }
  .rblock + .rblock { border-top:1px solid var(--faint); }
  .rlab { position:sticky; left:58px; z-index:5; flex:0 0 74px; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:0 4px; font-size:.78rem; font-weight:700; background:var(--room); border-right:2px solid var(--line); }
  .lcol { display:flex; flex-direction:column; }
  .row.sub .track { border-top:1px dashed var(--line); }
  .dn { position:absolute; top:0; height:18px; line-height:18px; text-align:center; font-size:.62rem; color:var(--dim); border-left:1px solid var(--grid); }
  .dw { position:absolute; top:0; height:16px; line-height:16px; text-align:center; font-size:.6rem; color:var(--faint); border-left:1px solid var(--grid); }
  .we { color:#b8464a; }
  .band { position:absolute; border-radius:5px; }
  .cell { position:absolute; border-radius:4px; color:#fff; font-size:.62rem; font-weight:700; text-align:center; display:flex; flex-direction:column; justify-content:center; line-height:1.15; cursor:default; overflow:hidden; }
  .cname { text-align:left; position:absolute; font-size:.7rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:15px; cursor:default; }
  .cname small { color:var(--dim); margin-left:4px; font-size:.64rem; }
  .hol { position:absolute; top:0; bottom:0; background:rgba(217,43,43,.85); cursor:default; }
  .hol.light { background:rgba(217,43,43,.26); }
  .hnote { position:absolute; top:1px; height:28px; background:#d92b2b; color:#fff; font-size:.62rem; font-weight:700; line-height:1.15; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 2px; overflow:hidden; cursor:default; border-radius:3px; }
  .hnote.light { background:rgba(217,43,43,.26); color:var(--ink); }
  .hnote.v span { writing-mode:vertical-rl; text-orientation:upright; letter-spacing:0; line-height:1; }
  .dn.holn, .dw.holn { background:#d92b2b; color:#fff; font-weight:700; }
  .dn.holl, .dw.holl { background:rgba(217,43,43,.22); color:var(--ink); font-weight:700; }
  .tcol { position:absolute; top:0; bottom:0; pointer-events:none; background:var(--today-bg);
    box-shadow:inset 1px 0 0 var(--today), inset -1px 0 0 var(--today); }
  #inner.flash .tcol { animation:tflash .45s ease-in-out 3; }
  @keyframes tflash { 50% { background:var(--today-flash); } }
  .dn.td, .dw.td { background:var(--today) !important; color:var(--today-ink) !important; font-weight:700; }
  .tnote { position:absolute; top:0; bottom:0; background:var(--today); pointer-events:none; }
  #inner.flash .tnote { animation:tflash2 .45s ease-in-out 3; }
  @keyframes tflash2 { 50% { opacity:.45; } }
  .tbox { position:absolute; top:-18px; height:34px; border:2px solid var(--today); border-radius:4px; pointer-events:none; display:none; z-index:2; }
  .tbox.show { display:block; }
  .tbox.pulse { animation:tpulse .45s ease-in-out 3; }
  @keyframes tpulse { 50% { box-shadow:0 0 0 4px var(--today-flash); transform:scale(1.12); } }
  #tip { position:fixed; pointer-events:none; background:var(--ink); color:var(--paper); font-size:.78rem; padding:8px 11px; border-radius:8px; opacity:0; transition:opacity .08s; z-index:20; max-width:320px; line-height:1.55; }
  .empty { padding:24px; text-align:center; color:var(--faint); }
</style>
</head>
<body>
<div class="wrap">
  <div><h1 id="title"></h1><div class="sub" id="sub"></div></div>
  <section class="card">
    <div class="bar">
      <div class="years" id="years"></div>
      <div class="months" id="months"></div>
      <button id="goToday">今天</button>
      <select id="slot"><option value="">全部分類</option><option>一三五夜間</option><option>二四夜間</option><option>日間</option><option>假日</option></select>
      <input type="search" id="q" placeholder="搜尋課程／老師">
      <div class="legend"><span><i style="background:rgba(120,140,130,.35)"></i>週末</span><span><i style="background:var(--today)"></i>今天</span><span><i style="background:#d92b2b"></i>元旦／農曆新年／端午節當天／中秋節當天</span><span><i style="background:rgba(217,43,43,.3)"></i>其他國定假日（含補假）</span><span>格子數字＝第幾堂</span></div>
    </div>
    <div class="scroller" id="sc"><div class="inner" id="inner"></div></div>
  </section>
</div>
<div id="tip"></div>

  });
  if (!q) GROUP_ORDER.filter(s=>!slotSel || s===slotSel).forEach(s=>   // 沒有搜尋時，固定教室一律列出
    ROOMS.forEach(([r])=>{ groups[s+"|"+r] ||= {slot:s, room:r, courses:{}}; }));
  return Object.values(groups).sort((a,b)=>GROUP_ORDER.indexOf(a.slot)-GROUP_ORDER.indexOf(b.slot)
    || roomRank(a.room)-roomRank(b.room) || a.room.localeCompare(b.room));
}

function render(){
  const inner = $("inner"); inner.innerHTML = "";
  inner.style.width = (LABW+TOTALW)+"px";
  // 表頭三列：月份 / 日期 / 星期
  const hdr = (h,top,cls,fill,bg)=>{ const r=document.createElement("div"); r.className="hrow"; r.style.top=top+"px"; r.style.height=h+"px"; r.innerHTML=`<div class="lab" style="height:${h}px;border-bottom:0;font-size:.7rem;color:var(--dim)">${cls}</div><div class="track" style="width:${TOTALW}px;height:${h}px;border-bottom:0">${fill}</div>`; if (bg) r.querySelector(".track").style.backgroundImage = bg; inner.appendChild(r); };
  let mh="", dh="", wh="";
  for (let m=0;m<12;m++) mh += `<div class="mon" style="left:${monthStarts[m]*COL}px;width:${monthDays(m)*COL}px;background:${MONTH_BG[m]}">${m+1} 月</div>`;
  for (let i=0;i<NDAYS;i++){ const dt=new Date(Date.UTC(YEAR,0,1+i)); const dw=dt.getUTCDay(), we=dw===0||dw===6;
    const hs = holAt(i), hh = hs ? (hs.strong ? "holn" : "holl") : "";
    const td = i===todayIdx ? "td" : "";
    dh += `<div class="dn ${we?"we":""} ${hh} ${td}" style="left:${i*COL}px;width:${COL}px">${dt.getUTCDate()}</div>`;
    wh += `<div class="dw ${we?"we":""} ${hh} ${td}" style="left:${i*COL}px;width:${COL}px">${DOW[dw]}</div>`; }
  // 備註列的今天：與日期／星期同色，連成一整塊（放最前面，假日名稱仍蓋在上面）
  let nh = todayIdx>=0 ? `<div class="tnote" style="left:${todayIdx*COL}px;width:${COL}px"></div>` : "";
  HOLS.forEach(h=>{ const w=(h.i1-h.i0+1)*COL, vert = (h.i1===h.i0);
    nh += `<div class="hnote ${vert?"v":""} ${h.strong?"":"light"}" data-h="${HOLS.indexOf(h)}" style="left:${h.i0*COL+1}px;width:${w-2}px"><span>${esc(h.name)}</span></div>`; });
  // 「今天」框：蓋住日期＋星期兩列（放在星期列，往上延伸到日期列）
  if (todayIdx>=0) wh += `<div id="todayBox" class="tbox${todayShown?" show":""}" style="left:${todayIdx*COL}px;width:${COL}px"></div>`;
  hdr(22,0,"月份",mh); hdr(18,22,"日期",dh); hdr(16,40,"星期",wh); hdr(30,56,"備註",nh,BG);
  const groups = buildGroups();
  let bodyTop = 56, n = 0;
  // 左側標籤：時段（合併）→ 教室（合併）→ 該教室的各條課程列
  const div = (cls, html="") => { const d=document.createElement("div"); d.className=cls; d.innerHTML=html; return d; };
  let curSlot = null, rcol = null;
  groups.forEach(g=>{
    if (g.slot !== curSlot){
      curSlot = g.slot;
      const sb = div("sblock"), sl = div("slab", `<span>${esc(g.slot).replace(/(.)夜間$/, "$1<br>夜間")}</span>`);
      sl.style.background = GROUP_BG[g.slot]||"var(--soft)";
      rcol = div("rcol"); sb.append(sl, rcol); inner.appendChild(sb);
    }
    const rb = div("rblock"), lcol = div("lcol");
    rb.append(div("rlab", `<span>${esc(roomName(g.room)).replace("(", "<br>(")}</span>`), lcol); rcol.appendChild(rb);
    const courses = Object.values(g.courses).map(c=>{
      const ds = Object.keys(c.days).sort(); c.first = dayIdx(ds[0]); c.last = dayIdx(ds[ds.length-1]); c.dates = ds;
      c.teacherTxt = [...new Set([...c.teachers].flatMap(t=>t.replace(/\s*\([^)]*\)/g,"").split("、")).map(x=>x.trim()).filter(Boolean))].join("、");
      const labelPx = Math.min(300, (c.short.length*11 + c.teacherTxt.length*9 + 20));
      c.occ = Math.max((c.last-c.first+1)*COL, labelPx);
      return c; }).sort((a,b)=>a.first-b.first || a.short.localeCompare(b.short));
    // 貪婪排線：同一條線上課程的占用範圍不可重疊
    const lanes = [];
    courses.forEach(c=>{
      let lane = lanes.find(l=>l.end < c.first*COL - 4);
      if (!lane){ lane = {end:-1,items:[]}; lanes.push(lane); }
      lane.items.push(c); lane.end = c.first*COL + c.occ;
      c.color = PAL[n++ % PAL.length];
    });
    if (!lanes.length) lanes.push({end:-1, items:[]});   // 沒有課的教室保留一列空白
    lanes.forEach((lane,li)=>{
      const row = document.createElement("div"); row.className = "row";
      const tr = document.createElement("div"); tr.className="track"; tr.style.width = TOTALW+"px"; tr.style.height = LANE_H+"px"; tr.style.backgroundImage = BG;
      if (todayIdx>=0){   // 今天：整欄淡紅底，畫在課程下方，不遮文字
        const t = document.createElement("div"); t.className = "tcol";
        t.style.cssText = `left:${todayIdx*COL}px;width:${COL}px`; tr.appendChild(t);
      }
      HOLS.forEach(h=>{   // 國定假日紅色警示條（畫在課程色帶下方，假日仍有排課時看得出衝突）
        const d = document.createElement("div"); d.className = "hol" + (h.strong ? "" : " light");
        d.style.cssText = `left:${h.i0*COL}px;width:${(h.i1-h.i0+1)*COL}px`;
        d.onmousemove = e=>showTip(e, holTip(h)); d.onmouseleave = hideTip; tr.appendChild(d);
      });
      lane.items.forEach(c=>{
        const band = document.createElement("div"); band.className="band"; band.style.cssText = `left:${c.first*COL}px;width:${(c.last-c.first+1)*COL}px;top:17px;height:31px;background:${c.color};opacity:.18`;
        tr.appendChild(band);
        const nm = document.createElement("div"); nm.className="cname"; nm.style.cssText = `left:${c.first*COL+2}px;top:1px;width:${c.occ}px;color:${c.color}`;
        nm.innerHTML = `<b>${esc(c.short)}</b><small>${esc(c.teacherTxt)}</small>`;
        nm.dataset.first = c.first*COL+2; nm.dataset.end = (c.last+1)*COL;   // 課名尾端不可超過最後一堂
        nm.onmousemove = e=>showTip(e, courseTip(c)); nm.onmouseleave = hideTip; tr.appendChild(nm);
        c.dates.forEach(ds=>{
          const items = c.days[ds], i = dayIdx(ds);
          const progs = items.map(x=>x.prog).filter(Boolean);
          const cell = document.createElement("div"); cell.className="cell";
          cell.style.cssText = `left:${i*COL+1}px;width:${COL-2}px;top:18px;height:29px;background:${c.color}`;
          cell.innerHTML = progs.length ? progs.map(p=>`<span>${esc(p.replace(/\s/g,""))}</span>`).join("") : "V";
          cell.onmousemove = e=>showTip(e, cellTip(c, ds, items)); cell.onmouseleave = hideTip;
          tr.appendChild(cell);
        });
      });
      if (li>0) row.classList.add("sub");
      row.appendChild(tr); lcol.appendChild(row);
    });
  });
  if (!groups.length){ const e=document.createElement("div"); e.className="empty"; e.textContent="沒有符合條件的課程"; inner.appendChild(e); }
  place();
  document.querySelectorAll(".hnote").forEach(n=>{ const h=HOLS[+n.dataset.h]; n.onmousemove=e=>showTip(e,holTip(h)); n.onmouseleave=hideTip; });
}
// 捲動時讓課名貼齊畫面左緣，不會因為起點在畫面外而被切掉
function place(){
  const left = $("sc").scrollLeft + 2;
  document.querySelectorAll(".cname").forEach(n=>{
    if (!n.dataset.tw){ const s=n.querySelector("small"); n.dataset.tw = n.querySelector("b").offsetWidth + (s ? s.offsetWidth+6 : 0); }
    const f = +n.dataset.first, mx = +n.dataset.end - +n.dataset.tw - 2;   // 最遠只能移到「文字尾端＝最後一堂」
    n.style.left = Math.max(f, Math.min(left, mx)) + "px";
  });
}
let raf = 0;
$("sc").addEventListener("scroll", ()=>{ if (!raf) raf = requestAnimationFrame(()=>{ raf = 0; place(); }); });
// 課程詳細資料：課名／時段・教室／期間（共幾堂課）／老師；滑在上課日時再列出當天每一堂
const tname = t => t.replace(/\s*[（(][^)）]*[)）]/g,"").split("/")[0].trim();
function courseTip(c, ds, items){
  const total = Object.values(c.days).reduce((a,x)=>a+x.length,0);
  const teachers = [...new Set([...c.teachers].flatMap(t=>t.split("、")).map(tname).filter(Boolean))].join("、");
  const tm = {};   // 上課時間：依上午／下午分組，同組不同時間以「、」列出
  Object.values(c.days).flat().forEach(x=>{ if (x.time) (tm[x.half ? x.half+"午 " : ""] ||= new Set()).add(x.time); });
  const timeTxt = Object.keys(tm).sort().map(k=>k+[...tm[k]].join("、")).join("／") || "—";
  let h = `<b>${esc(c.name)}</b><br>${esc(c.slot)}・${esc(c.room)}<br>期間：${c.dates[0]} ～ ${c.dates[c.dates.length-1]}（共 ${total} 堂課）<br>時間：${esc(timeTxt)}<br>老師：${esc(teachers)}`;
  if (items) h += `<hr style="border:0;border-top:1px solid rgba(255,255,255,.25);margin:5px 0">${ds}（${DOW[new Date(ds+"T00:00").getDay()]}）` +
    items.map(x=>`<br>${x.half?x.half+"午　":""}第 ${esc(x.prog||"?")} 堂　${esc(x.teacher)}`).join("");
  return h;
}
const cellTip = courseTip;
$("months").innerHTML = Array.from({length:12},(_,m)=>`<button data-m="${m}">${m+1}月</button>`).join("");
document.querySelectorAll("#months button").forEach(b=>b.onclick=()=>{ $("sc").scrollLeft = monthStarts[+b.dataset.m]*COL - 4; });
let todayShown = false;
$("years").innerHTML = (META.years||[YEAR]).map(y=>`<a href="${y}.html"${y===YEAR?' class="cur"':""}>${y} 年</a>`).join("");
$("goToday").onclick=()=>{
  if (todayIdx<0){ location.href = "index.html"; return; }   // 在其他年度頁時回到今年
  $("sc").scrollLeft = Math.max(0, todayIdx*COL - 200);
  todayShown = true;
  const b = $("todayBox"); if (!b) return;
  b.classList.add("show"); b.classList.remove("pulse"); void b.offsetWidth; b.classList.add("pulse");   // 重新播放閃爍提示
  const inn = $("inner"); inn.classList.remove("flash"); void inn.offsetWidth; inn.classList.add("flash");
  clearTimeout(inn._t); inn._t = setTimeout(()=>inn.classList.remove("flash"), 1500);
};
$("slot").onchange=render; $("q").oninput=render;
$("title").textContent = `中壢分校 ${YEAR} 年度課程行事曆`;
const fdates = [...new Set(META.fetched.map(f=>f[1]))];
$("sub").textContent = `資料日期：${fdates.join("、")}（涵蓋 ${META.fetched.length} 個月） · 共 ${DATA.length} 堂、${new Set(DATA.map(d=>d.tid)).size} 門課（來源：排課表）`;
render();
if (todayIdx>=0) $("sc").scrollLeft = Math.max(0, todayIdx*COL - 200);
</script>
</body>
</html>

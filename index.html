<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中壢分校年度排課表</title>
<style>
  :root { color-scheme: light;
    --paper:#f3f4f3; --card:#fff; --ink:#1f2421; --dim:#5f6763; --grid:#dcdfdd; --we:#e4e4e4; --hol:#f6d5d5; --holx:#e06666;
    --today:#cc0000; --slotline:#222; --roomline:#8a8f8c; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px 16px 48px; background:var(--paper); color:var(--ink);
    font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif; }
  .wrap { max-width:1600px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr); gap:12px; }
  h1 { text-align:center; margin:0 0 2px; font-size:clamp(1.3rem,3.6vw,1.8rem); }
  .sub { text-align:center; color:var(--dim); font-size:.84rem; }
  .card { background:var(--card); border:1px solid #d6d9d7; border-radius:10px; padding:12px 14px; min-width:0; }
  .bar { display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; margin-bottom:10px; }
  button, select, input[type=search] { font:inherit; font-size:.82rem; color:var(--ink); background:#fff; border:1px solid #c9cdcb; border-radius:6px; padding:4px 9px; }
  button { cursor:pointer; } button:hover { background:#f1f3f2; }
  .months { display:flex; gap:3px; flex-wrap:wrap; }
  .legend { display:flex; gap:12px; flex-wrap:wrap; font-size:.75rem; color:var(--dim); margin-left:auto; }
  .legend i { display:inline-block; width:12px; height:12px; border:1px solid #bbb; vertical-align:-2px; margin-right:4px; }
  .scroller { overflow:auto; max-height:78vh; border:1px solid #bfc4c1; background:#fff; }

  table { border-collapse:separate; border-spacing:0; table-layout:fixed; font-size:11px; }
  th, td { border-right:1px solid var(--grid); border-bottom:1px solid var(--grid); padding:0; height:20px;
    text-align:center; white-space:nowrap; overflow:hidden; }
  col.d { width:30px; }
  thead th { position:sticky; z-index:4; background:#fff; font-weight:600; }
  thead tr.r0 th { top:0; height:24px; font-size:12px; border-bottom:1px solid #b9bebb; }
  thead tr.r1 th { top:24px; }
  thead tr.r2 th { top:44px; font-weight:400; color:var(--dim); }
  thead tr.r3 th { top:64px; height:30px; font-size:10px; font-weight:600; border-bottom:2px solid var(--slotline); }
  thead th.corner { left:0; z-index:6; background:#eef0ef; text-align:right; padding-right:8px; color:var(--dim); font-weight:600; }
  th.we { background:#d9d9d9 !important; color:#444; }
  th.holS { background:var(--holx) !important; color:#fff; }
  th.holL { background:var(--hol) !important; }
  th.todayH { background:var(--today) !important; color:#fff; }
  th.hn { white-space:normal; line-height:1.1; padding:0 2px; cursor:default; }
  th.hn.S { background:var(--holx); color:#fff; } th.hn.L { background:var(--hol); color:var(--ink); }
  th.hn.v span { writing-mode:vertical-rl; text-orientation:upright; letter-spacing:-1px; }

  tbody th { position:sticky; z-index:3; font-weight:700; background:#fff; }
  th.slot { left:0; width:58px; white-space:normal; line-height:1.3; font-size:12px; border-right:1px solid #aaa; }
  th.room { left:58px; width:78px; white-space:normal; line-height:1.25; background:#d9d2e9; font-size:11px; border-right:1px solid #aaa; }
  th.item { left:136px; width:36px; font-weight:400; color:var(--dim); border-right:2px solid #999; }
  td.we { background:var(--we); }
  td.hol { background:var(--hol); }
  td.tcol { box-shadow:inset 2px 0 0 var(--today); }
  td.c { cursor:default; }
  tr.crs td { overflow:visible; }   /* 課名從課程起點延伸到整段期間 */
  td.s { font-weight:700; }
  td .cn { position:relative; z-index:1; display:inline-block; overflow:hidden; text-overflow:ellipsis; vertical-align:top;
    text-align:left; padding-left:3px; font-weight:700; }
  tr.prog td.s { color:#1f2421; }
  tr.tch td.s { font-size:10px; font-weight:400; color:#333; letter-spacing:-.3px; }

  tr.slotTop > * { border-top:3px solid var(--slotline); }
  tr.roomTop > * { border-top:1px solid var(--roomline); }
  tr.laneTop > td, tr.laneTop > th.item { border-top:1px dashed #b5bab7; }

  #tip { position:fixed; pointer-events:none; background:#1f2421; color:#fff; font-size:.78rem; padding:8px 11px; border-radius:7px;
    opacity:0; transition:opacity .08s; z-index:20; max-width:330px; line-height:1.55; }
  .empty { padding:24px; text-align:center; color:#999; }
</style>
</head>
<body>
<div class="wrap">
  <div><h1 id="title"></h1><div class="sub" id="sub"></div></div>
  <section class="card">
    <div class="bar">
      <div class="months" id="months"></div>
      <button id="goToday">今天</button>
      <select id="slot"><option value="">全部時段</option><option>夜間</option><option>日間</option><option>午間</option><option>假日</option></select>
      <input type="search" id="q" placeholder="搜尋課程／老師">
      <div class="legend"><span><i style="background:#d9d9d9"></i>週末</span><span><i style="background:var(--today)"></i>今天</span><span><i style="background:var(--holx)"></i>元旦／農曆新年／端午／中秋</span><span><i style="background:var(--hol)"></i>其他國定假日</span><span><i style="background:#cfe2f3"></i>課程期間</span><span><i style="background:#9fc5e8"></i>上課日</span></div>
    </div>
    <div class="scroller" id="sc"></div>
  </section>
</div>
<div id="tip"></div>

, "name": "就業認證直播-室內設計實務 (7602 虛擬教室)", "short": "就業認證直播-室內設計實務", "loc": "7602 虛擬教室", "teacher": "胡景文/胖虎 (胡景文)", "tid": "1120261005160920", "prog": "18"}, {"date": "2026-12-30", "slot": "夜間", "half": "", "room": "教室一", "name": "PS (1101)", "short": "PS", "loc": "1101", "teacher": "楊馥庭/庭庭 (楊馥庭)", "tid": "1120250918171100", "prog": "2"}, {"date": "2026-12-30", "slot": "夜間", "half": "", "room": "雲端教室二", "name": "就業認證直播-2D美術設計 (7602 虛擬教室)", "short": "就業認證直播-2D美術設計", "loc": "7602 虛擬教室", "teacher": "午零 (楊敏琦)", "tid": "1120261013145925", "prog": "6"}];
const META = {"today": "2026-10-14", "fetched": [[1, "2026-10-14"], [2, "2026-10-14"], [3, "2026-10-14"], [4, "2026-10-14"], [5, "2026-10-14"], [6, "2026-10-14"], [7, "2026-10-14"], [8, "2026-10-14"], [9, "2026-10-14"], [10, "2026-10-14"], [11, "2026-10-14"], [12, "2026-10-14"]], "holidays": [{"name": "元旦", "start": "2026-01-01", "end": "2026-01-01", "strong": true, "note": "1/1（四）"}, {"name": "春節", "start": "2026-02-14", "end": "2026-02-15", "strong": false, "note": "小年夜2/15（日）；補假於初四2/20"}, {"name": "農曆新年", "start": "2026-02-16", "end": "2026-02-21", "strong": true, "note": "除夕2/16、初一至初三2/17–2/19、初四2/20（小年夜補假）、初五2/21"}, {"name": "春節", "start": "2026-02-22", "end": "2026-02-22", "strong": false, "note": "春節連假最後一天（日）"}, {"name": "和平紀念日", "start": "2026-02-27", "end": "2026-03-01", "strong": false, "note": "2/28（六）於2/27（五）補假"}, {"name": "兒童節、清明節", "start": "2026-04-03", "end": "2026-04-06", "strong": false, "note": "兒童節4/4（六）於4/3補假；清明節4/5（日）於4/6補假"}, {"name": "勞動節", "start": "2026-05-01", "end": "2026-05-03", "strong": false, "note": "5/1（五）"}, {"name": "端午節", "start": "2026-06-19", "end": "2026-06-19", "strong": true, "note": "6/19（五）"}, {"name": "端午連假", "start": "2026-06-20", "end": "2026-06-21", "strong": false, "note": "端午節連假的週末（6/20六、6/21日）"}, {"name": "中秋節", "start": "2026-09-25", "end": "2026-09-25", "strong": true, "note": "9/25（五）"}, {"name": "中秋連假", "start": "2026-09-26", "end": "2026-09-27", "strong": false, "note": "中秋節連假的週末（9/26六、9/27日）"}, {"name": "教師節", "start": "2026-09-28", "end": "2026-09-28", "strong": false, "note": "9/28（一）"}, {"name": "國慶日", "start": "2026-10-09", "end": "2026-10-11", "strong": false, "note": "10/10（六）於10/9（五）補假"}, {"name": "光復節", "start": "2026-10-24", "end": "2026-10-26", "strong": false, "note": "10/25（日）於10/26（一）補假"}, {"name": "行憲紀念日", "start": "2026-12-25", "end": "2026-12-27", "strong": false, "note": "12/25（五）"}]};
const COL = 30, LEFTW = 172;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DOW = ["日","一","二","三","四","五","六"];
const MONTH_BG = ["#b6d7a8","#ead1dc","#c9daf8","#cfe2f3","#f4cccc","#fce5cd","#d9ead3","#d0e0e3","#c9daf8","#cfe2f3","#d9d2e9","#ead1dc"];
const SLOT_BG = {"夜間":"#fce5cd","日間":"#cfe2f3","午間":"#d9ead3","假日":"#ead1dc"};
const GROUP_ORDER = ["夜間","日間","午間","假日"];
// [課程期間, 上課日]
const PAL = [["#cfe2f3","#9fc5e8"],["#d9d2e9","#b4a7d6"],["#d9ead3","#b6d7a8"],["#fce5cd","#f9cb9c"],["#f4cccc","#ea9999"],
             ["#fff2cc","#ffe599"],["#d0e0e3","#a2c4c9"],["#ead1dc","#d5a6bd"],["#c9daf8","#a4c2f4"],["#e6b8af","#dd7e6b"]];
const dayIdx = s => Math.round((Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)) - Date.UTC(YEAR,0,1))/864e5);
const NDAYS = (YEAR%4===0&&(YEAR%100!==0||YEAR%400===0)) ? 366 : 365;
const pad = n => String(n).padStart(2,"0");
const DAYS = Array.from({length:NDAYS},(_,i)=>{ const dt=new Date(Date.UTC(YEAR,0,1+i)); const dw=dt.getUTCDay();
  return {m:dt.getUTCMonth(), d:dt.getUTCDate(), dw, we:dw===0||dw===6, iso:`${YEAR}-${pad(dt.getUTCMonth()+1)}-${pad(dt.getUTCDate())}`}; });
const HOLS = (META.holidays||[]).map(h=>({...h, i0:dayIdx(h.start), i1:dayIdx(h.end)}));
HOLS.forEach(h=>{ for(let i=Math.max(0,h.i0);i<=Math.min(NDAYS-1,h.i1);i++) DAYS[i].hol=h; });
const todayIdx = META.today.startsWith(String(YEAR)) ? dayIdx(META.today) : -1;
const monthStart = m => DAYS.findIndex(d=>d.m===m);
const tname = t => t.replace(/\s*[（(][^)）]*[)）]/g,"").split("/")[0].trim();
const colorOf = tid => { let h=0; for (const ch of String(tid)) h=(h*31+ch.charCodeAt(0))>>>0; return PAL[h%PAL.length]; };

const tip = $("tip");
function showTip(e,h){ tip.innerHTML=h; tip.style.opacity=1; const w=tip.offsetWidth; let x=e.clientX+14; if(x+w>innerWidth-8) x=e.clientX-w-14; tip.style.left=x+"px"; tip.style.top=(e.clientY+14)+"px"; }
function hideTip(){ tip.style.opacity=0; }

let COURSES = [];
function build(){
  const q = $("q").value.trim().toLowerCase(), slotSel = $("slot").value;
  const groups = {};
  DATA.forEach(d=>{
    if (slotSel && d.slot!==slotSel) return;
    if (q && !(d.name+d.teacher).toLowerCase().includes(q)) return;
    const g = (groups[d.slot+"|"+d.room] ||= {slot:d.slot, room:d.room, courses:{}});
    const c = (g.courses[d.tid] ||= {tid:d.tid, name:d.name, short:d.short, loc:d.loc, slot:d.slot, room:d.room, days:{}});
    (c.days[d.date] ||= []).push(d);
  });
  const bySlot = {};
  Object.values(groups).sort((a,b)=>a.room.localeCompare(b.room)).forEach(g=>{
    const cs = Object.values(g.courses).map(c=>{ const ds=Object.keys(c.days).sort(); c.first=dayIdx(ds[0]); c.last=dayIdx(ds[ds.length-1]); c.col=colorOf(c.tid); return c; })
      .sort((a,b)=>a.first-b.first || a.short.localeCompare(b.short));
    const lanes = [];
    cs.forEach(c=>{ let l = lanes.find(l=>l.end < c.first); if(!l){ l={end:-1,items:[]}; lanes.push(l); } l.items.push(c); l.end=c.last; });
    g.lanes = lanes; (bySlot[g.slot] ||= []).push(g);
  });
  COURSES = [];
  return GROUP_ORDER.filter(s=>bySlot[s]).map(s=>({slot:s, rooms:bySlot[s]}));
}

function headHTML(){
  let r0 = `<tr class="r0"><th class="corner" colspan="3">月份</th>`;
  for (let m=0;m<12;m++){ const n=DAYS.filter(d=>d.m===m).length; r0 += `<th colspan="${n}" style="background:${MONTH_BG[m]}">${m+1} 月</th>`; }
  let r1 = `<tr class="r1"><th class="corner" colspan="3">日期</th>`, r2 = `<tr class="r2"><th class="corner" colspan="3">星期</th>`;
  DAYS.forEach((d,i)=>{ const cls = i===todayIdx ? "todayH" : d.hol ? (d.hol.strong?"holS":"holL") : d.we ? "we" : "";
    r1 += `<th class="${cls}">${d.d}</th>`; r2 += `<th class="${cls}">${DOW[d.dw]}</th>`; });
  let r3 = `<tr class="r3"><th class="corner" colspan="3">備註</th>`;
  for (let i=0;i<NDAYS;){ const h=DAYS[i].hol;
    if (h && i===Math.max(0,h.i0)){ const n=Math.min(NDAYS-1,h.i1)-i+1;
      r3 += `<th colspan="${n}" class="hn ${h.strong?"S":"L"} ${n===1?"v":""}" data-h="${HOLS.indexOf(h)}"><span>${esc(h.name)}</span></th>`; i+=n; }
    else { r3 += `<th class="${DAYS[i].we?"we":""}"></th>`; i++; } }
  return `<thead>${r0}</tr>${r1}</tr>${r2}</tr>${r3}</tr></thead>`;
}

function bodyHTML(slots){
  let h = "<tbody>";
  slots.forEach(sg=>{
    const slotRows = sg.rooms.reduce((a,g)=>a+g.lanes.length*3,0);
    sg.rooms.forEach((g,gi)=>{
      g.lanes.forEach((lane,li)=>{
        const band = new Array(NDAYS);
        lane.items.forEach(c=>{ const k=COURSES.push(c)-1; c.k=k; for(let i=c.first;i<=c.last;i++) band[i]=c; });
        // 課名標籤：課程起點＋每個月第一天各放一次；可往右延伸到下一個標籤或下一門課為止
        const labelAt = new Map();
        lane.items.forEach(c=>{ labelAt.set(c.first, c);
          for (let m=0;m<12;m++){ const ms=monthStart(m); if (ms>c.first && ms<=c.last) labelAt.set(ms, c); } });
        const labelW = new Map();
        labelAt.forEach((c,i)=>{ let j=i+1; while (j<NDAYS && (!band[j] || band[j]===c) && !labelAt.has(j)) j++;
          labelW.set(i, Math.min((j-i)*COL-3, 320)); });
        ["課程","進度","講師"].forEach((item,ri)=>{
          const top = ri===0 ? (gi===0&&li===0 ? "slotTop" : li===0 ? "roomTop" : "laneTop") : "";
          h += `<tr class="${top} ${["crs","prog","tch"][ri]}">`;
          if (gi===0 && li===0 && ri===0) h += `<th class="slot" rowspan="${slotRows}" style="background:${SLOT_BG[sg.slot]||"#eee"}">${esc(sg.slot)}</th>`;
          if (li===0 && ri===0) h += `<th class="room" rowspan="${g.lanes.length*3}">${esc(g.room)}</th>`;
          h += `<th class="item">${item}</th>`;
          for (let i=0;i<NDAYS;i++){
            const c = band[i], D = DAYS[i], items = c && c.days[D.iso];
            let cls = (i===todayIdx ? "tcol " : ""), style = "", txt = "";
            if (ri===0 && c) style = `background:${items ? c.col[1] : c.col[0]}`;
            else if (D.hol) cls += "hol "; else if (D.we) cls += "we ";
            if (ri===0 && labelAt.has(i)) txt = `<span class="cn" style="max-width:${labelW.get(i)}px">${esc(labelAt.get(i).short)}</span>`;
            if (items){ cls += "s c ";
              if (ri===1) txt = esc(items.map(x=>x.prog).filter(Boolean).join("/"));
              if (ri===2) txt = esc([...new Set(items.flatMap(x=>x.teacher.split("、")).map(tname))].join("、")); }
            else if (c) cls += "c ";
            h += `<td class="${cls}"${c?` data-k="${c.k}" data-i="${i}"`:""}${style?` style="${style}"`:""}>${txt}</td>`;
          }
          h += "</tr>";
        });
      });
    });
  });
  return h + "</tbody>";
}

function render(){
  const slots = build();
  const cols = `<colgroup><col style="width:58px"><col style="width:78px"><col style="width:36px">${'<col class="d">'.repeat(NDAYS)}</colgroup>`;
  $("sc").innerHTML = slots.length
    ? `<table style="width:${LEFTW+NDAYS*COL}px">${cols}${headHTML()}${bodyHTML(slots)}</table>`
    : `<div class="empty">沒有符合條件的課程</div>`;
}

function cellTip(c, i){
  const D = DAYS[i], items = c.days[D.iso];
  const teachers = [...new Set(Object.values(c.days).flat().flatMap(x=>x.teacher.split("、")).map(tname))].join("、");
  const total = Object.values(c.days).reduce((a,x)=>a+x.length,0);
  let h = `<b>${esc(c.name)}</b><br>${esc(c.slot)}・${esc(c.room)}<br>期間：${DAYS[c.first].iso} ～ ${DAYS[c.last].iso}（今年 ${total} 堂）<br>老師：${esc(teachers)}`;
  if (items) h += `<hr style="border:0;border-top:1px solid #555;margin:5px 0">${D.iso}（${DOW[D.dw]}）` +
    items.map(x=>`<br>${x.half?x.half+"午　":""}第 ${esc(x.prog||"?")} 堂　${esc(x.teacher)}`).join("");
  return h;
}
function holTip(h){ const n=h.i1-h.i0+1; return `<b>${esc(h.name)}</b><br>${h.start.slice(5).replace("-","/")}${n>1?" ～ "+h.end.slice(5).replace("-","/"):""}（共 ${n} 天）<br>${esc(h.note)}`; }
$("sc").addEventListener("mousemove", e=>{
  const td = e.target.closest("td[data-k]"); if (td) return showTip(e, cellTip(COURSES[+td.dataset.k], +td.dataset.i));
  const hn = e.target.closest("th[data-h]"); if (hn) return showTip(e, holTip(HOLS[+hn.dataset.h]));
  hideTip();
});
$("sc").addEventListener("mouseleave", hideTip);

const scrollToDay = i => { $("sc").scrollLeft = Math.max(0, i*COL - 4); };
$("months").innerHTML = Array.from({length:12},(_,m)=>`<button data-m="${m}">${m+1}月</button>`).join("");
document.querySelectorAll("#months button").forEach(b=>b.onclick=()=>scrollToDay(monthStart(+b.dataset.m)));
$("goToday").onclick=()=>{ if (todayIdx>=0) scrollToDay(todayIdx-3); };
let qt = 0; $("q").oninput = ()=>{ clearTimeout(qt); qt = setTimeout(render, 200); };
$("slot").onchange = render;
$("title").textContent = `中壢分校 ${YEAR} 年度排課表`;
const fdates = [...new Set(META.fetched.map(f=>f[1]))];
$("sub").textContent = `資料日期：${fdates.join("、")}（涵蓋 ${META.fetched.length} 個月） · 共 ${DATA.length} 堂、${new Set(DATA.map(d=>d.tid)).size} 門課（來源：排課表）`;
render();
if (todayIdx>=0) scrollToDay(todayIdx-3);
</script>

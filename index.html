<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中壢分校年度課程行事曆</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Design System：warm paper / ink / caramel accent；Instrument Serif + Space Grotesk + JetBrains Mono；4px 基準間距；200ms／600ms 動態 */
  :root {
    --paper:oklch(97% 0.01 80); --card:oklch(99.3% 0.005 80); --ink:oklch(18% 0.02 80);
    --dim:oklch(46% 0.02 80); --faint:oklch(66% 0.015 80); --line:oklch(89% 0.014 80); --soft:oklch(94.5% 0.012 80);
    --accent:oklch(65% 0.15 60); --accent-soft:oklch(65% 0.15 60 / .14);
    --shadow:0 1px 2px oklch(18% 0.02 80 / .05),0 8px 24px oklch(18% 0.02 80 / .06);
    --f-display:"Instrument Serif","Noto Serif TC","PMingLiU",serif;
    --f-ui:"Space Grotesk","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    --f-mono:"JetBrains Mono","Consolas",ui-monospace,monospace;
    --s1:4px; --s2:8px; --s3:16px; --s4:24px; --s5:40px; --s6:64px;
    --t-micro:200ms ease-out; --t-page:600ms ease-in-out;
    --g-night:#fbe3cf; --g-day:#d6e6f0; --g-noon:#d9ecd9; --g-hol:#f4d9e4;
    --today:#f2c200; --today-ink:#3d3000; --today-bg:rgba(255,221,64,.22); --today-flash:rgba(255,214,0,.55);
    --grid:rgba(140,150,145,.22); --room:#e4def0; --memo:#ffd479; --memo-ink:#9a6400;
    --sel:#3f7cac; --sel-bg:rgba(63,124,172,.16);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --paper:oklch(18% 0.02 80); --card:oklch(21.5% 0.02 80); --ink:oklch(95% 0.012 80);
    --dim:oklch(74% 0.02 80); --faint:oklch(52% 0.02 80); --line:oklch(30% 0.02 80); --soft:oklch(25% 0.02 80);
    --accent:oklch(72% 0.14 60); --accent-soft:oklch(72% 0.14 60 / .18);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --g-night:#3a2c20; --g-day:#1f2f3a; --g-noon:#233326; --g-hol:#3a2530;
    --today:#e0b400; --today-ink:#1a1400; --today-bg:rgba(240,200,40,.14); --today-flash:rgba(240,200,40,.4);
    --room:#2c2838; --memo:#8a5a00; --memo-ink:#e8b85a;
    --sel:#5b9bd0; --sel-bg:rgba(91,155,208,.18); } }
  * { box-sizing:border-box; }
  body { margin:0; padding:var(--s5) var(--s3) var(--s6); background:var(--paper); color:var(--ink);
    font-family:var(--f-ui); line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1500px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr); gap:var(--s4); }
  h1 { text-align:center; margin:0 0 var(--s2); font-family:var(--f-display); font-weight:400; letter-spacing:.01em;
    font-size:clamp(1.8rem,4.6vw,2.6rem); line-height:1.15; }
  h1::after { content:""; display:block; width:var(--s5); height:2px; margin:var(--s2) auto 0; background:var(--accent); border-radius:2px; }
  .sub { text-align:center; color:var(--dim); font-size:.84rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:var(--s3) var(--s4); box-shadow:var(--shadow); min-width:0; }
  .bar { display:flex; flex-wrap:wrap; gap:var(--s2) var(--s3); align-items:center; margin-bottom:var(--s3); }
  button, select, input[type=search] { font-family:inherit; font-size:.82rem; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:var(--s1) 12px;
    transition:border-color var(--t-micro), background var(--t-micro), color var(--t-micro), box-shadow var(--t-micro); }
  button { cursor:pointer; }
  button:hover, select:hover, input:hover { border-color:var(--accent); }
  button:hover { background:var(--accent-soft); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  #goToday { background:var(--accent); border-color:var(--accent); color:oklch(99% 0.005 80); font-weight:600; }
  #goToday:hover { filter:brightness(1.05); }
  .months { display:flex; gap:var(--s1); flex-wrap:wrap; }
  .startlab { display:flex; align-items:center; gap:var(--s2); font-size:.82rem; font-weight:600; }
  input[type=date] { font-family:var(--f-mono); font-size:.8rem; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:var(--s1) var(--s2);
    transition:border-color var(--t-micro), box-shadow var(--t-micro); }
  .months button { padding:var(--s1) 10px; }
  .legend { display:flex; gap:var(--s3); flex-wrap:wrap; font-size:.76rem; color:var(--dim); margin-left:auto; }
  .legend i { display:inline-block; width:11px; height:11px; border-radius:3px; vertical-align:-1px; margin-right:4px; }
  .scroller { overflow:auto; max-height:78vh; border:1px solid var(--line); border-radius:10px; background:var(--card); }
  .inner { position:relative; }
  .row { display:flex; }
  .lab { position:sticky; left:0; z-index:5; flex:0 0 var(--labw); width:var(--labw); border-right:2px solid var(--line); border-bottom:1px solid var(--line);
    padding:4px 8px; font-size:.78rem; font-weight:600; display:flex; align-items:center; }
  .track { position:relative; border-bottom:1px solid var(--line); flex:0 0 auto; }
  .hdr .lab, .hdr .track { position:sticky; z-index:6; background:var(--card); }
  .hdr .track { border-bottom:0; }
  .hrow { position:sticky; z-index:7; background:var(--card); display:flex; }
  .hrow .lab { z-index:8; background:var(--card); }
  .mon { position:absolute; top:0; height:22px; line-height:22px; text-align:center; font-size:.78rem; font-weight:700; color:#16211d; border-right:1px solid rgba(0,0,0,.12); }
  /* 左側合併標籤：時段 → 教室 → 課程列 */
  .sblock { display:flex; border-top:3px solid var(--ink); }
  /* 表頭下方粗黑線：放在固定的「備註」列底部，捲動時不會跑掉 */
  #inner > .hrow:nth-child(4) { box-shadow:0 3px 0 var(--ink); }
  #inner > .hrow + .sblock { border-top:3px solid transparent; }
  .slab { position:sticky; left:0; z-index:5; flex:0 0 58px; display:flex; align-items:center; justify-content:center;
    text-align:center; line-height:1.35; font-size:.82rem; font-weight:700; border-right:1px solid var(--line); }
  .rcol { display:flex; flex-direction:column; }
  .rblock { display:flex; }
  .rblock + .rblock { border-top:1px solid var(--faint); }
  .rlab { position:sticky; left:58px; z-index:5; flex:0 0 74px; display:flex; align-items:center; justify-content:center; text-align:center;
    padding:0 4px; font-size:.78rem; font-weight:700; background:var(--room); border-right:2px solid var(--line); }
  .lcol { display:flex; flex-direction:column; }
  .row.sub .track { border-top:1px dashed var(--line); }
  .dn { position:absolute; top:0; height:18px; line-height:18px; text-align:center; font-family:var(--f-mono); font-size:.6rem; color:var(--dim); border-left:1px solid var(--grid); }
  .dw { position:absolute; top:0; height:16px; line-height:16px; text-align:center; font-size:.6rem; color:var(--faint); border-left:1px solid var(--grid); }
  .we { color:#b8464a; }
  .band { position:absolute; border-radius:5px; }
  .cell { position:absolute; border-radius:4px; color:#fff; font-family:var(--f-mono); font-size:.6rem; font-weight:600; text-align:center; display:flex; flex-direction:column; justify-content:center; line-height:1.15; cursor:default; overflow:hidden; }
  .cell.plan { background:var(--card) !important; border:2px dashed; }
  /* 嵌在編輯器裡：只留行事曆 */
  body.embed { padding:8px; }
  .cell.leave { background:oklch(55% 0.2 27) !important; color:#fff; font-weight:700; display:grid; place-items:center; z-index:3; }
  .dpact { display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; margin:6px 0 8px; padding:8px 10px; border-radius:10px; background:oklch(95% 0.03 28); font-size:.8rem; }
  .dpact span { color:var(--dim); font-size:.74rem; }
  .dpact label { display:flex; align-items:center; gap:4px; cursor:pointer; }
  .dpact input[type=text], .dpact #dpName { padding:2px 6px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  .dpact .go { margin-left:auto; background:oklch(52% 0.18 28); color:#fff; border:0; border-radius:8px; padding:5px 12px; font-weight:700; cursor:pointer; }
  @media (prefers-color-scheme: dark){ .dpact { background:oklch(30% 0.05 28); } }
  body.embed .wrap > div:first-child, body.embed .opencard, body.embed #goOpen, body.embed #goTracks { display:none !important; }
  body.embed .card { padding:var(--s2) var(--s3); box-shadow:none; }
  body.embed .scroller { max-height:calc(100vh - 110px); }
  body.embed .planbar { margin-bottom:var(--s2); padding:4px var(--s3); }
  body.embed .legend, body.embed .startlab { display:none; }
  body.embed .bar { margin-bottom:var(--s2); gap:4px 8px; }
  body.embed .months button, body.embed .bar button, body.embed .bar select, body.embed .bar input { padding:2px 8px; font-size:.74rem; }
  .planbar { background:var(--accent-soft); color:var(--ink); border-radius:10px; padding:var(--s2) var(--s3); font-size:.84rem; margin-bottom:var(--s3); }
  .cname { text-align:left; position:absolute; font-size:.7rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:15px; cursor:default; }
  .cname small { color:var(--dim); margin-left:4px; font-size:.64rem; }
  .hol { position:absolute; top:0; bottom:0; background:rgba(217,43,43,.85); cursor:default; }
  .hol.light { background:rgba(217,43,43,.26); }
  .hnote { position:absolute; top:1px; height:28px; background:#d92b2b; color:#fff; font-size:.62rem; font-weight:700; line-height:1.15; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 2px; overflow:hidden; cursor:default; border-radius:3px; }
  .hnote.light { background:rgba(217,43,43,.26); color:var(--ink); }
  .hnote.v span { writing-mode:vertical-rl; text-orientation:upright; letter-spacing:-1px; line-height:1; font-size:.55rem; white-space:nowrap; }
  .dn.holn, .dw.holn { background:#d92b2b; color:#fff; font-weight:700; }
  .dn.holl, .dw.holl { background:rgba(217,43,43,.22); color:var(--ink); font-weight:700; }
  #tip .memo { color:var(--memo); }
  /* 近 3 個月開班 */
  .opencard .oh { display:flex; align-items:baseline; gap:var(--s3); flex-wrap:wrap; margin-bottom:var(--s2); }
  .opencard h2 { margin:0; font-family:var(--f-display); font-weight:400; font-size:1.7rem; }
  .opencard #openRange { color:var(--dim); font-size:.84rem; }
  .opencard .osum { display:flex; gap:var(--s2) var(--s3); flex-wrap:wrap; margin-bottom:var(--s3); }
  .opencard .kpi { background:var(--soft); border-radius:12px; padding:var(--s2) var(--s3); min-width:120px; }
  .opencard .kpi b { display:block; font-family:var(--f-mono); font-size:1.4rem; font-weight:600; }
  .opencard .kpi span { color:var(--dim); font-size:.76rem; }
  .opencard .kpi.warn b { color:oklch(52% 0.18 28); }
  .opencard .tw { overflow-x:auto; }
  .opencard table { border-collapse:collapse; width:100%; font-size:.82rem; }
  .opencard th, .opencard td { text-align:left; padding:var(--s2) 10px; border-bottom:1px solid var(--line); white-space:nowrap; vertical-align:middle; }
  .opencard th { color:var(--dim); font-weight:600; font-size:.74rem; }
  .opencard td.n { font-family:var(--f-mono); text-align:right; }
  .opencard th.n { text-align:right; }
  .opencard td.d { font-family:var(--f-mono); font-size:.78rem; }
  .opencard td.cn { white-space:normal; min-width:220px; max-width:420px; font-weight:500; }
  .opencard td.cn .dm { display:block; color:var(--memo-ink); font-size:.72rem; font-weight:400; margin-top:2px; }
  .opencard td.rm { color:var(--dim); font-size:.78rem; }
  .ctag { display:inline-block; padding:2px 10px; border-radius:999px; font-size:.74rem; font-weight:600; color:var(--ink); }
  .opencard tr.mh td { background:var(--soft); font-weight:700; font-size:.78rem; color:var(--dim); }
  .opencard tr.mh td .mt { float:right; font-weight:500; font-family:var(--f-mono); }
  .opencard tfoot td { font-weight:700; border-top:2px solid var(--ink); border-bottom:0; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; font-size:.74rem; font-weight:600; }
  .badge.ok { background:oklch(90% 0.08 150); color:oklch(35% 0.1 150); }
  .badge.no { background:oklch(90% 0.07 28); color:oklch(42% 0.16 28); }
  .badge.na { background:var(--soft); color:var(--faint); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .badge.ok { background:oklch(32% 0.07 150); color:oklch(85% 0.1 150); }
    :root:not([data-theme="light"]) .badge.no { background:oklch(32% 0.08 28); color:oklch(85% 0.1 28); } }
  /* 專班線規劃 */
  /* 瀑布流：課少的卡片往上補位，不會被同列長卡片撐出空白 */
  .tkgrid { columns:3 340px; column-gap:var(--s3); }
  .tkgrid > .tk { break-inside:avoid; margin-bottom:var(--s3); }
  .tkyear { margin:var(--s4) 0 var(--s2); font-family:var(--f-display); font-weight:400; font-size:1.35rem; }
  .tkyear:first-of-type { margin-top:var(--s2); }
  .tk { border:1px solid var(--line); border-radius:12px; padding:var(--s3); background:var(--card); display:flex; flex-direction:column; gap:var(--s2); }
  .tk.done { opacity:.6; }
  .tk h3 { margin:0; font-size:.98rem; line-height:1.35; }
  .tk .tm { display:flex; flex-wrap:wrap; gap:var(--s1) var(--s2); font-size:.76rem; color:var(--dim); }
  .tk .rail { height:6px; border-radius:3px; background:var(--soft); overflow:hidden; }
  .tk .rail i { display:block; height:100%; background:var(--accent); border-radius:3px; }
  .tk ol { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
  .tk li { display:grid; grid-template-columns:14px 1fr auto; gap:var(--s1) var(--s2); align-items:start; padding:6px 0; border-top:1px dashed var(--line); font-size:.8rem; }
  .tk li:first-child { border-top:0; }
  .tk li .dot { width:10px; height:10px; margin-top:4px; border-radius:50%; border:2px solid var(--faint); }
  .tk li.past { color:var(--faint); }
  .tk li.past .dot { background:var(--faint); border-color:var(--faint); }
  .tk li.now .dot { background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .tk li.now .cn { font-weight:700; }
  .tk li.next .dot { border-color:var(--accent); }
  .tk li .dr { display:block; font-family:var(--f-mono); font-size:.7rem; color:var(--dim); }
  .tk li.past .dr { color:var(--faint); }
  .tk li .pc { margin-left:var(--s2); padding:0 6px; border-radius:6px; background:var(--soft); color:var(--dim); font-family:var(--f-ui); white-space:nowrap; }
  .tk li .pc b { color:var(--ink); font-family:var(--f-mono); font-weight:600; }
  .tk li .sx { display:block; font-size:.7rem; color:var(--dim); }
  .tk .badge { font-size:.68rem; padding:1px 8px; white-space:nowrap; }
  .tksrc { color:var(--dim); font-size:.78rem; }
  .tksrc a { color:inherit; }
  /* 選取日期：整欄淡藍＋上方當天課程清單 */
  .dn, .dw { cursor:pointer; }
  .scol { position:absolute; top:0; bottom:0; pointer-events:none; background:var(--sel-bg);
    box-shadow:inset 2px 0 0 var(--sel), inset -2px 0 0 var(--sel); }
  .snote { position:absolute; top:0; bottom:0; background:var(--sel); pointer-events:none; }
  .dn.sel, .dw.sel { background:var(--sel) !important; color:#fff !important; font-weight:700; }
  .daypanel { margin-bottom:var(--s3); border:2px solid var(--sel); border-radius:12px; padding:var(--s3); background:var(--card);
    animation:panelIn var(--t-page) both; }
  @keyframes panelIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:none; } }
  .daypanel td:first-child { font-family:var(--f-mono); font-size:.76rem; }
  #sc.pagein { animation:pageIn var(--t-page) both; }
  @keyframes pageIn { from { opacity:0; } to { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .daypanel, #sc.pagein { animation:none; } * { transition:none !important; } }
  .daypanel .dph { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .daypanel .dph b { font-size:1rem; }
  .daypanel .dph .hol-tag { font-size:.75rem; background:rgba(217,43,43,.18); border-radius:6px; padding:2px 8px; }
  .daypanel .dph .x { margin-left:auto; padding:2px 10px; }
  .daypanel .tw { overflow-x:auto; }
  .daypanel table { border-collapse:collapse; width:100%; font-size:.8rem; }
  .daypanel th, .daypanel td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; white-space:nowrap; }
  .daypanel th { color:var(--dim); font-weight:600; font-size:.74rem; }
  .daypanel td.cn { white-space:normal; min-width:220px; }
  .daypanel .dm { display:block; color:var(--memo-ink); font-size:.72rem; margin-top:2px; }
  .daypanel .none { color:var(--faint); padding:6px 2px; }
  .tcol { position:absolute; top:0; bottom:0; pointer-events:none; background:var(--today-bg);
    box-shadow:inset 1px 0 0 var(--today), inset -1px 0 0 var(--today); }
  #inner.flash .tcol { animation:tflash .45s ease-in-out 3; }
  @keyframes tflash { 50% { background:var(--today-flash); } }
  .dn.td, .dw.td { background:var(--today) !important; color:var(--today-ink) !important; font-weight:700; }
  .tnote { position:absolute; top:0; bottom:0; background:var(--today); pointer-events:none; }
  #inner.flash .tnote { animation:tflash2 .45s ease-in-out 3; }
  @keyframes tflash2 { 50% { opacity:.45; } }
  .tbox { position:absolute; top:-18px; height:34px; border:2px solid var(--today); border-radius:4px; pointer-events:none; display:none; z-index:2; }
  .tbox.show { display:block; }
  .tbox.pulse { animation:tpulse .45s ease-in-out 3; }
  @keyframes tpulse { 50% { box-shadow:0 0 0 4px var(--today-flash); transform:scale(1.12); } }
  #tip { position:fixed; pointer-events:none; background:var(--ink); color:var(--paper); font-size:.78rem; padding:8px 11px; border-radius:8px; opacity:0; transition:opacity var(--t-micro); z-index:20; font-family:var(--f-ui); max-width:320px; line-height:1.55; }
  .empty { padding:24px; text-align:center; color:var(--faint); }
</style>
</head>
<body>
<div class="wrap">
  <div><h1 id="title"></h1><div class="sub" id="sub"></div></div>
  <section class="card">
    <div class="bar">
      <label class="startlab">起始日 <input type="date" id="start"></label>
      <div class="months" id="months"></div>
      <button id="goToday">今天</button>
      <button id="goOpen" type="button">近 3 個月開班 ↓</button>
      <button id="goTracks" type="button">專班線規劃 ↓</button>
      <select id="slot"><option value="">全部分類</option><option>一三五夜間</option><option>二四夜間</option><option>日間</option><option>假日</option></select>
      <input type="search" id="q" placeholder="搜尋課程／老師">
      <div class="legend"><span><i style="background:rgba(120,140,130,.35)"></i>週末</span><span><i style="background:var(--today)"></i>今天</span><span><i style="background:rgba(217,43,43,.3)"></i>國定假日（含補假）</span><span>格子數字＝第幾堂</span><span><i style="background:var(--sel)"></i>點日期看當天全部課程</span></div>
    </div>
    <div class="planbar" id="planBar" hidden></div>
    <div class="daypanel" id="dayPanel" hidden></div>
    <div class="scroller" id="sc"><div class="inner" id="inner"></div></div>
  </section>
  <section class="card opencard" id="openCard" hidden>
    <div class="oh"><h2>近 3 個月開班</h2><span id="openRange"></span></div>
    <div class="osum" id="openSum"></div>
    <div class="tw" id="openTable"></div>
  </section>
  <section class="card opencard" id="trackCard" hidden>
    <div class="oh"><h2>中壢分校 專班線規劃</h2><span class="tksrc" id="trackSrc"></span></div>
    <div class="osum" id="trackSum"></div>
    <div id="trackBody"></div>
  </section>
</div>
<div id="tip"></div>

const roomRank = r => { const i = ROOMS.findIndex(x=>x[0]===r); return i<0 ? 99 : i; };
const MONTH_BG = ["#b6d7a8","#ead1dc","#c9daf8","#cfe2f3","#f4cccc","#fce5cd","#d9ead3","#d0e0e3","#c9daf8","#cfe2f3","#d9d2e9","#ead1dc"];
const GROUP_BG = {"一三五夜間":"var(--g-night)","二四夜間":"var(--g-noon)","日間":"var(--g-day)","假日":"var(--g-hol)"};
const tip = $("tip");
function showTip(e,h){
  tip.innerHTML=h; tip.style.opacity=1;
  const w=tip.offsetWidth, ht=tip.offsetHeight;
  let x=e.clientX+14; if(x+w>innerWidth-8) x=e.clientX-w-14;
  let y=e.clientY+14; if(y+ht>innerHeight-8) y=e.clientY-ht-14;   // 下方放不下就改放在滑鼠上方
  tip.style.left=Math.max(8,x)+"px"; tip.style.top=Math.max(8,Math.min(y,innerHeight-ht-8))+"px";
}
function hideTip(){ tip.style.opacity=0; }
document.documentElement.style.setProperty("--labw", LABW+"px");

// 依起始日重算：月份區段、週末／格線背景、假日、今天位置、區間內的課程
let monthSegs = [], BG = "", HOLS = [], todayIdx = -1, VIEW = [];
function setWindow(iso){
  START = msOf(iso);
  if (META.planPreview) {   // 規劃的課程期間較長：行事曆延長到最後一堂課（含規劃課）之後兩週
    const last = DATA.reduce((m,d)=>d.date>m ? d.date : m, "");
    NDAYS = Math.max(365, last ? Math.round((msOf(last)-START)/864e5) + 15 : 0); TOTALW = NDAYS*COL;
  }
  END_ISO = isoOf(START + (NDAYS-1)*864e5);
  monthSegs = [];
  for (let i=0;i<NDAYS;i++){ const d = dayDate(i);
    if (i===0 || d.getUTCDate()===1) monthSegs.push({i, y:d.getUTCFullYear(), m:d.getUTCMonth(), n:0});
    monthSegs[monthSegs.length-1].n++; }
  let r = "";
  for (let i=0;i<NDAYS;i++){ const dw=dayDate(i).getUTCDay(); if(dw===0||dw===6) r += `<rect x='${i*COL}' y='0' width='${COL}' height='100%' fill='rgba(120,140,130,.14)'/>`; }
  for (let i=1;i<NDAYS;i++) r += `<rect x='${i*COL}' y='0' width='1' height='100%' fill='rgba(140,150,145,.22)'/>`;   // 每日淺灰格線
  monthSegs.slice(1).forEach(s=>{ r += `<rect x='${s.i*COL}' y='0' width='1' height='100%' fill='rgba(120,140,130,.45)'/>`; });
  BG = `url("data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='${TOTALW}' height='100%' preserveAspectRatio='none'>${r}</svg>`)}")`;
  // 國定假日一律淡紅色（投票日不上課：深紅色）；同一段連假（相鄰且說明相同）合併成一個標籤，例如「春節／春節／春節連假」→「春節」
  const merged = [];
  (META.holidays||[]).forEach(h=>{ const p = merged[merged.length-1];
    if (p && p.note===h.note && msOf(h.start)-msOf(p.end)===864e5){ p.end = h.end; if (!p.names.includes(h.name)) p.names.push(h.name); }
    else merged.push({...h, names:[h.name]}); });
  merged.forEach(h=>{ h.name = h.names.filter(n=>!(n.endsWith("連假") && h.names.includes(n.slice(0,-2)))).join("、"); });
  HOLS = merged.map(h=>({...h, strong:!!(h.vote || h.closure), i0:dayIdx(h.start), i1:dayIdx(h.end)}))
    .filter(h=>h.i1>=0 && h.i0<NDAYS).map(h=>({...h, i0:Math.max(0,h.i0), i1:Math.min(NDAYS-1,h.i1)}));
  todayIdx = dayIdx(META.today); if (todayIdx<0 || todayIdx>=NDAYS) todayIdx = -1;
  VIEW = DATA.filter(d=>d.date>=iso && d.date<=END_ISO);
  $("start").value = iso;
  $("months").innerHTML = monthSegs.map((s,k)=>`<button data-i="${s.i}">${k===0||s.m===0 ? s.y+"年" : ""}${s.m+1}月</button>`).join("");
  document.querySelectorAll("#months button").forEach(b=>b.onclick=()=>{ $("sc").scrollLeft = Math.max(0, +b.dataset.i*COL - 4); });
  const f = s => s.replace(/-/g,"/");
  $("title").textContent = `中壢分校課程行事曆　${f(iso)} ～ ${f(END_ISO)}`;
  $("sub").textContent = `資料日期：${[...new Set(META.fetched.map(x=>x[1]))].join("、")} · 此區間共 ${VIEW.length} 堂、${new Set(VIEW.map(d=>d.tid)).size} 門課（來源：排課表；假日：人事行政總處）`;
}
const holAt = i => HOLS.find(h=>i>=h.i0 && i<=h.i1);
function holTip(h){ const n=(msOf(h.end)-msOf(h.start))/864e5+1; return `<b>${esc(h.name)}</b><br>${h.start.slice(5).replace("-","/")}${n>1?" ～ "+h.end.slice(5).replace("-","/"):""}（共 ${n} 天）<br>${esc(h.note)}`; }

function buildGroups(){
  const q = $("q").value.trim().toLowerCase(), slotSel = $("slot").value;
  const groups = {};
  VIEW.forEach(d=>{
    const cat = catOf(d);
    if (slotSel && cat!==slotSel) return;
    if (q && !(d.name+d.teacher+(d.alias||"")).toLowerCase().includes(q)) return;
    const gk = cat+"|"+d.room;
    const g = (groups[gk] ||= {slot:cat, room:d.room, courses:{}});
    const c = (g.courses[d.tid] ||= {tid:d.tid, name:d.name, short:d.short, loc:d.loc, slot:cat, room:roomName(d.room), teachers:new Set(), days:{}, plan:!!d.plan});
    c.teachers.add(d.teacher);
    const day = (c.days[d.date] ||= []); day.push(d);
  });
  if (!q) GROUP_ORDER.filter(s=>!slotSel || s===slotSel).forEach(s=>   // 沒有搜尋時，固定教室一律列出
    ROOMS.forEach(([r])=>{ groups[s+"|"+r] ||= {slot:s, room:r, courses:{}}; }));
  return Object.values(groups).sort((a,b)=>GROUP_ORDER.indexOf(a.slot)-GROUP_ORDER.indexOf(b.slot)
    || roomRank(a.room)-roomRank(b.room) || a.room.localeCompare(b.room));
}

function render(){
  const inner = $("inner"); inner.innerHTML = "";
  inner.style.width = (LABW+TOTALW)+"px";
  // 表頭三列：月份 / 日期 / 星期
  const hdr = (h,top,cls,fill,bg)=>{ const r=document.createElement("div"); r.className="hrow"; r.style.top=top+"px"; r.style.height=h+"px"; r.innerHTML=`<div class="lab" style="height:${h}px;border-bottom:0;font-size:.7rem;color:var(--dim)">${cls}</div><div class="track" style="width:${TOTALW}px;height:${h}px;border-bottom:0">${fill}</div>`; if (bg) r.querySelector(".track").style.backgroundImage = bg; inner.appendChild(r); };
  let mh="", dh="", wh="";
  monthSegs.forEach((s,k)=>{ mh += `<div class="mon" style="left:${s.i*COL}px;width:${s.n*COL}px;background:${MONTH_BG[s.m]}">${k===0||s.m===0 ? s.y+" 年 " : ""}${s.m+1} 月</div>`; });
  for (let i=0;i<NDAYS;i++){ const dt=dayDate(i); const dw=dt.getUTCDay(), we=dw===0||dw===6;
    const hs = holAt(i), hh = hs ? (hs.strong ? "holn" : "holl") : "";
    const td = (i===todayIdx ? "td" : "") + (i===selIdx() ? " sel" : "");
    dh += `<div class="dn ${we?"we":""} ${hh} ${td}" style="left:${i*COL}px;width:${COL}px">${dt.getUTCDate()}</div>`;
    wh += `<div class="dw ${we?"we":""} ${hh} ${td}" style="left:${i*COL}px;width:${COL}px">${DOW[dw]}</div>`; }
  // 備註列的今天：與日期／星期同色，連成一整塊（放最前面，假日名稱仍蓋在上面）
  let nh = todayIdx>=0 ? `<div class="tnote" style="left:${todayIdx*COL}px;width:${COL}px"></div>` : "";
  if (selIdx()>=0) nh += `<div class="snote" style="left:${selIdx()*COL}px;width:${COL}px"></div>`;
  HOLS.forEach(h=>{ const w=(h.i1-h.i0+1)*COL, vert = (h.i1===h.i0);
    nh += `<div class="hnote ${vert?"v":""} ${h.strong?"":"light"}" data-h="${HOLS.indexOf(h)}" style="left:${h.i0*COL+1}px;width:${w-2}px"><span>${esc(h.name)}</span></div>`; });
  // 「今天」框：蓋住日期＋星期兩列（放在星期列，往上延伸到日期列）
  if (todayIdx>=0) wh += `<div id="todayBox" class="tbox${todayShown?" show":""}" style="left:${todayIdx*COL}px;width:${COL}px"></div>`;
  hdr(22,0,"月份",mh); hdr(18,22,"日期",dh); hdr(16,40,"星期",wh); hdr(30,56,"備註",nh,BG);
  const groups = buildGroups();
  let bodyTop = 56, n = 0;
  // 左側標籤：時段（合併）→ 教室（合併）→ 該教室的各條課程列
  const div = (cls, html="") => { const d=document.createElement("div"); d.className=cls; d.innerHTML=html; return d; };
  let curSlot = null, rcol = null;
  groups.forEach(g=>{
    if (g.slot !== curSlot){
      curSlot = g.slot;
      const sb = div("sblock"), sl = div("slab", `<span>${esc(g.slot).replace(/(.)夜間$/, "$1<br>夜間")}</span>`);
      sl.style.background = GROUP_BG[g.slot]||"var(--soft)";
      rcol = div("rcol"); sb.append(sl, rcol); inner.appendChild(sb);
    }
    const rb = div("rblock"), lcol = div("lcol");
    rb.append(div("rlab", `<span>${esc(roomName(g.room)).replace("(", "<br>(")}</span>`), lcol); rcol.appendChild(rb);
    const courses = Object.values(g.courses).map(c=>{
      const ds = Object.keys(c.days).sort(); c.first = dayIdx(ds[0]); c.last = dayIdx(ds[ds.length-1]); c.dates = ds;
      c.teacherTxt = [...new Set([...c.teachers].flatMap(t=>t.replace(/\s*\([^)]*\)/g,"").split("、")).map(x=>x.trim()).filter(Boolean))].join("、");
      const labelPx = Math.min(300, (c.short.length*11 + c.teacherTxt.length*9 + 20));
      c.occ = Math.max((c.last-c.first+1)*COL, labelPx);
      return c; }).sort((a,b)=>a.first-b.first || a.short.localeCompare(b.short));
    // 貪婪排線：同一條線上課程的占用範圍不可重疊
    const lanes = [];
    courses.forEach(c=>{
      let lane = lanes.find(l=>l.end < c.first*COL - 4);
      if (!lane){ lane = {end:-1,items:[]}; lanes.push(lane); }
      lane.items.push(c); lane.end = c.first*COL + c.occ;
      c.color = PAL[n++ % PAL.length];
    });
    if (!lanes.length) lanes.push({end:-1, items:[]});   // 沒有課的教室保留一列空白
    lanes.forEach((lane,li)=>{
      const row = document.createElement("div"); row.className = "row";
      const tr = document.createElement("div"); tr.className="track"; tr.style.width = TOTALW+"px"; tr.style.height = LANE_H+"px"; tr.style.backgroundImage = BG;
      if (todayIdx>=0){   // 今天：整欄淡紅底，畫在課程下方，不遮文字
        const t = document.createElement("div"); t.className = "tcol";
        t.style.cssText = `left:${todayIdx*COL}px;width:${COL}px`; tr.appendChild(t);
      }
      if (selIdx()>=0){   // 選取的日期：整欄淡藍
        const s = document.createElement("div"); s.className = "scol";
        s.style.cssText = `left:${selIdx()*COL}px;width:${COL}px`; tr.appendChild(s);
      }
      HOLS.forEach(h=>{   // 國定假日紅色警示條（畫在課程色帶下方，假日仍有排課時看得出衝突）
        const d = document.createElement("div"); d.className = "hol" + (h.strong ? "" : " light");
        d.style.cssText = `left:${h.i0*COL}px;width:${(h.i1-h.i0+1)*COL}px`;
        d.onmousemove = e=>showTip(e, holTip(h)); d.onmouseleave = hideTip; tr.appendChild(d);
      });
      lane.items.forEach(c=>{
        const band = document.createElement("div"); band.className="band"; band.style.cssText = `left:${c.first*COL}px;width:${(c.last-c.first+1)*COL}px;top:17px;height:31px;background:${c.color};opacity:${c.plan?.07:.18}`;
        tr.appendChild(band);
        const nm = document.createElement("div"); nm.className="cname"; nm.style.cssText = `left:${c.first*COL+2}px;top:1px;width:${c.occ}px;color:${c.color}`;
        nm.innerHTML = `<b>${esc(c.short)}</b><small>${esc(c.teacherTxt)}</small>`;
        nm.dataset.first = c.first*COL+2; nm.dataset.end = (c.last+1)*COL;   // 課名尾端不可超過最後一堂
        nm.onmousemove = e=>showTip(e, courseTip(c)); nm.onmouseleave = hideTip; tr.appendChild(nm);
        c.dates.forEach(ds=>{
          const items = c.days[ds], i = dayIdx(ds);
          const progs = items.map(x=>x.prog).filter(Boolean);
          const cell = document.createElement("div"); cell.className="cell";
          cell.style.cssText = `left:${i*COL+1}px;width:${COL-2}px;top:18px;height:29px;background:${c.color}`;
          if (c.plan) { cell.classList.add("plan"); cell.style.color = c.color; cell.style.borderColor = c.color; }   // 規劃中：虛線框
          cell.innerHTML = progs.length ? progs.map(p=>`<span>${esc(p.replace(/\s/g,""))}</span>`).join("") : "V";
          cell.onmousemove = e=>showTip(e, cellTip(c, ds, items)); cell.onmouseleave = hideTip;
          tr.appendChild(cell);
        });
        ((META.leaves||{})[c.tid]||[]).forEach(lv=>{   // 講師請假：只在這門課那一天標紅（不是整天）
          const i = dayIdx(lv.date); if (i<0 || i>=NDAYS) return;
          const m = document.createElement("div"); m.className = "cell leave";
          m.style.cssText = `left:${i*COL+1}px;width:${COL-2}px;top:18px;height:29px`;
          m.innerHTML = "<span>假</span>";
          m.onmousemove = e=>showTip(e, `<b>${esc(lv.reason)}</b><br>${lv.date.replace(/-/g,"/")}（${DOW[new Date(lv.date+"T00:00").getDay()]}）停課，後面順延<br>${esc(c.name)}`);
          m.onmouseleave = hideTip; tr.appendChild(m);
        });
      });
      if (li>0) row.classList.add("sub");
      row.appendChild(tr); lcol.appendChild(row);
    });
  });
  if (!groups.length){ const e=document.createElement("div"); e.className="empty"; e.textContent="沒有符合條件的課程"; inner.appendChild(e); }
  place();
  renderDayPanel();
  document.querySelectorAll(".hnote").forEach(n=>{ const h=HOLS[+n.dataset.h]; n.onmousemove=e=>showTip(e,holTip(h)); n.onmouseleave=hideTip; });
}
// 捲動時讓課名貼齊畫面左緣，不會因為起點在畫面外而被切掉
function place(){
  const left = $("sc").scrollLeft + 2;
  document.querySelectorAll(".cname").forEach(n=>{
    if (!n.dataset.tw){ const s=n.querySelector("small"); n.dataset.tw = n.querySelector("b").offsetWidth + (s ? s.offsetWidth+6 : 0); }
    const f = +n.dataset.first, mx = +n.dataset.end - +n.dataset.tw - 2;   // 最遠只能移到「文字尾端＝最後一堂」
    n.style.left = Math.max(f, Math.min(left, mx)) + "px";
  });
}
let raf = 0;
$("sc").addEventListener("scroll", ()=>{ if (!raf) raf = requestAnimationFrame(()=>{ raf = 0; place(); }); });
// 課程詳細資料：課名／時段・教室／期間（共幾堂課）／老師；滑在上課日時再列出當天每一堂
const tname = t => t.replace(/\s*[（(][^)）]*[)）]/g,"").split("/")[0].trim();
function courseTip(c, ds, items){
  const total = Object.values(c.days).reduce((a,x)=>a+x.length,0);
  const teachers = [...new Set([...c.teachers].flatMap(t=>t.split("、")).map(tname).filter(Boolean))].join("、");
  const tm = {};   // 上課時間：依上午／下午分組，同組不同時間以「、」列出
  Object.values(c.days).flat().forEach(x=>{ if (x.time) (tm[x.half ? x.half+"午 " : ""] ||= new Set()).add(x.time); });
  const timeTxt = Object.keys(tm).sort().map(k=>k+[...tm[k]].join("、")).join("／") || "—";
  let h = `<b>${esc(c.name)}</b><br>${esc(c.slot)}・${esc(c.room)}<br>期間：${c.dates[0]} ～ ${c.dates[c.dates.length-1]}（共 ${total} 堂課）<br>時間：${esc(timeTxt)}<br>老師：${esc(teachers)}`;
  const memo = (META.memos||{})[c.tid];   // 課程備註（課程鐘點登錄頁的兩個備註欄位）
  if (memo) h += memo.map(m=>`<br><span class="memo">備註：${esc(m)}</span>`).join("");
  if (items) h += `<hr style="border:0;border-top:1px solid rgba(255,255,255,.25);margin:5px 0">${ds}（${DOW[new Date(ds+"T00:00").getDay()]}）` +
    items.map(x=>`<br>${x.half?x.half+"午　":""}${x.prog ? "第 "+esc(x.prog)+" 堂" : esc(x.slot)}　${x.time?esc(x.time)+"　":""}${esc(x.teacher)}`).join("");
  return h;
}
const cellTip = courseTip;
let todayShown = false;
// 選取日期：點表頭或課程區任一天 → 整欄標示＋上方列出當天所有課程（再點同一天或按關閉取消）
let selIso = null;
const EDIT_MODE = !!(META.planPreview && new URLSearchParams(location.search).get("embed"));   // 嵌在規劃編輯器（本機）才能異動
const selIdx = () => { if (!selIso) return -1; const i = dayIdx(selIso); return i>=0 && i<NDAYS ? i : -1; };
function renderDayPanel(){
  const p = $("dayPanel");
  if (!selIso){ p.hidden = true; return; }
  const q = $("q").value.trim().toLowerCase(), slotSel = $("slot").value;
  const rows = DATA.filter(d=>d.date===selIso && (!slotSel || catOf(d)===slotSel) && (!q || (d.name+d.teacher+(d.alias||"")).toLowerCase().includes(q)));
  rows.sort((a,b)=>(a.time||"99").localeCompare(b.time||"99") || GROUP_ORDER.indexOf(catOf(a))-GROUP_ORDER.indexOf(catOf(b))
    || roomRank(a.room)-roomRank(b.room));
  const hol = [...new Set((META.holidays||[]).filter(h=>h.start<=selIso && selIso<=h.end).map(h=>h.name.replace(/連假$/,"")))];
  const memoOf = t => (META.memos||{})[t] || [];
  // 嵌在規劃編輯器裡：可以勾選當天的課「停課順延」（送給編輯器開黑色視窗逐班確認）
  const canRe = d => EDIT_MODE && !d.plan && /^\d+$/.test(d.tid);
  const reN = new Set(rows.filter(canRe).map(d=>d.tid)).size;
  p.innerHTML = `<div class="dph"><b>${selIso.replace(/-/g,"/")}（${DOW[new Date(selIso+"T00:00").getDay()]}）當天課程</b>`
    + `<span>共 ${rows.length} 堂${q||slotSel ? "（已套用篩選）" : ""}</span>`
    + (hol.length ? `<span class="hol-tag">國定假日／停課：${esc(hol.join("、"))}</span>` : "")
    + Object.entries(META.leaves||{}).flatMap(([t, ls])=>ls.filter(l=>l.date===selIso).map(l=>   // 這天講師請假（已順延）的課
        `<span class="hol-tag">${esc(l.reason)}：${esc(((DATA.find(d=>d.tid===t)||{}).short)||t)}</span>`)).join("")
    + `<button class="x" id="dpClose">關閉</button></div>`
    + (reN ? `<div class="dpact"><b>停課順延</b><span>勾選這天不上課的課程，按下後會開黑色視窗逐班確認（輸入 y 才送出系統）</span>`
      + `<label><input type="checkbox" id="dpMemo" checked> 學員專區備註加這天停課</label>`
      + `<label>停課原因 <select id="dpWhy"><option value="leave">講師請假（只標這門課這天）</option><option value="closure">颱風／天災（整天紅底）</option><option value="">不標示</option></select>`
      + `<input id="dpName" value="講師請假" size="7" title="行事曆上顯示的文字"></label>`
      + `<button id="dpGo" class="go">勾選的課停課順延…</button></div>` : "")
    + (rows.length ? `<div class="tw"><table><thead><tr>${reN ? `<th><input type="checkbox" id="dpAll" title="全選"></th>` : ""}<th>時間</th><th>分類</th><th>教室</th><th>課程</th><th>堂次</th><th>老師</th></tr></thead><tbody>`
      + rows.map(d=>`<tr>${reN ? `<td>${canRe(d) ? `<input type="checkbox" class="dpc" value="${esc(d.tid)}">` : ""}</td>` : ""}<td>${d.half ? d.half+"午 " : ""}${esc(d.time||d.slot)}</td><td>${esc(catOf(d))}</td><td>${esc(roomName(d.room))}</td>`
        + `<td class="cn">${esc(d.name)}${memoOf(d.tid).map(m=>`<span class="dm">備註：${esc(m)}</span>`).join("")}</td>`
        + `<td>${d.prog ? "第 "+esc(d.prog)+" 堂" : ""}</td><td>${esc(d.teacher)}</td></tr>`).join("")
      + `</tbody></table></div>` : `<div class="none">這天沒有課程</div>`);
  p.hidden = false;
  $("dpClose").onclick = ()=>{ selIso = null; render(); };
  if (reN) {
    const boxes = () => [...p.querySelectorAll(".dpc")];
    $("dpAll").onchange = e => boxes().forEach(b => b.checked = e.target.checked);
    p.addEventListener("change", e => { if (e.target.classList.contains("dpc")) { const b = boxes(), v = e.target.value;
      b.filter(x => x.value === v).forEach(x => x.checked = e.target.checked); $("dpAll").checked = b.every(x => x.checked); } });   // 同一班上午／下午一起勾
    $("dpGo").onclick = () => {
      const tids = [...new Set(boxes().filter(b => b.checked).map(b => b.value))];
      if (!tids.length) return alert("請先勾選要停課順延的課程");
      const names = tids.map(t => (rows.find(d => d.tid === t) || {}).name || t);
      const why = $("dpWhy").value;
      parent.postMessage({type:"reschedule", date:selIso, tids, names, memo:$("dpMemo").checked, why,
        mark: why ? ($("dpName").value.trim() || (why === "leave" ? "講師請假" : "停課")) : ""}, location.origin);
    };
    $("dpWhy").onchange = e => { const n = $("dpName"); n.hidden = !e.target.value;
      if (e.target.value === "leave" && n.value === "颱風天") n.value = "講師請假";
      if (e.target.value === "closure" && n.value === "講師請假") n.value = "颱風天"; };
  }
}
$("inner").addEventListener("click", e=>{
  if (e.target.closest(".lab, .slab, .rlab")) return;   // 點到左側標籤不算
  const x = e.clientX - $("inner").getBoundingClientRect().left - LABW;
  const i = Math.floor(x / COL);
  if (x < 0 || i >= NDAYS) return;
  const iso = isoOf(START + i*864e5);
  selIso = selIso===iso ? null : iso;
  render();
  if (selIso) $("dayPanel").scrollIntoView({block:"nearest", behavior:"smooth"});
});
const DEFAULT_START = META.today.slice(0,8) + "01";   // 預設：本月 1 日
const okDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s||"") && !isNaN(msOf(s));
function show(iso, keepUrl){   // 切換起始日並重畫；網址記錄 ?start= 方便分享
  setWindow(iso); render(); $("sc").scrollLeft = 0;
  const sc = $("sc"); sc.classList.remove("pagein"); void sc.offsetWidth; sc.classList.add("pagein");   // 600ms 淡入
  if (!keepUrl) history.replaceState(null, "", iso===DEFAULT_START ? location.pathname : `?start=${iso}`);
}
const ys = META.years || [];
if (ys.length){ $("start").min = `${Math.min(...ys)}-01-01`; $("start").max = `${Math.max(...ys)}-12-31`; }
$("start").onchange = ()=>{ if (okDate($("start").value)) show($("start").value); };
$("goToday").onclick=()=>{
  if (todayIdx<0) show(DEFAULT_START);   // 今天不在目前區間：回到本月起始
  $("sc").scrollLeft = Math.max(0, todayIdx*COL - 200);
  todayShown = true;
  const b = $("todayBox"); if (!b) return;
  b.classList.add("show"); b.classList.remove("pulse"); void b.offsetWidth; b.classList.add("pulse");   // 重新播放閃爍提示
  const inn = $("inner"); inn.classList.remove("flash"); void inn.offsetWidth; inn.classList.add("flash");
  clearTimeout(inn._t); inn._t = setTimeout(()=>inn.classList.remove("flash"), 1500);
};
// 近 3 個月開班（本月＋後兩個月）：開課摘要的新生／總人數＋學習落差表的課程大綱填寫狀況
function renderOpenings(){
  const o = META.openings; if (!o || !o.classes) return;
  const cls = o.classes, ms = o.months, f = s => s.replace(/-/g,"/");
  const where = c => { const d = DATA.find(x=>x.tid===c.tid);   // 有排課資料就用分類＋教室，否則用開課摘要的時段／地點
    if (d) return {cat:catOf(d), room:roomName(d.room)};
    // 還沒排課：把開課摘要的時段換成同樣的四類（週六日／全天→假日、日間午間→日間、夜間依星期）
    const s = c.slot, [cy,cm,cd] = c.open.split("/").map(Number), dw = new Date(cy,cm-1,cd).getDay();
    const cat = /週[六日]|全天|假/.test(s) ? "假日" : /日間|午間/.test(s) ? "日間"
      : /二四/.test(s) ? "二四夜間" : /一三/.test(s) ? "一三五夜間"
      : /夜/.test(s) ? ([1,3,5].includes(dw) ? "一三五夜間" : "二四夜間") : (dw===0||dw===6 ? "假日" : s);
    return {cat, room:c.loc}; };
  const catTag = s => `<span class="ctag" style="background:${GROUP_BG[s]||"var(--soft)"}">${esc(s)}</span>`;
  const memoOf = t => (META.memos||{})[t] || [];
  const badge = c => c.outline==="filled" ? `<span class="badge ok">已填寫</span>`
    : c.outline==="missing" ? `<span class="badge no">未填寫</span>`
    : c.outline==="exempt" ? `<span class="badge na">不需填寫</span>` : `<span class="badge na">無法讀取</span>`;
  const sum = a => a.reduce((s,c)=>s+c.new,0), cur = a => a.reduce((s,c)=>s+c.current,0);
  const miss = cls.filter(c=>c.outline==="missing").length;
  $("openRange").textContent = `${ms[0][0]}年${ms[0][1]}月 ～ ${ms[2][0]}年${ms[2][1]}月 開課 · 資料日期 ${o.fetched}`;
  $("openSum").innerHTML = `<div class="kpi"><b>${cls.length}</b><span>開班數</span></div>`
    + `<div class="kpi ${miss?"warn":""}"><b>${miss}</b><span>課程大綱未填寫</span></div>`;
  let h = `<table><thead><tr><th>開課日</th><th>課程名稱</th><th>分類</th><th>教室</th><th>講師</th><th class="n">新生</th><th class="n">總人數</th><th>課程大綱</th></tr></thead><tbody>`;
  ms.forEach(([y,m])=>{
    const rows = cls.filter(c=>{ const [cy,cm] = c.open.split("/").map(Number); return cy===y && cm===m; });
    h += `<tr class="mh"><td colspan="8">${y}年${m}月　${rows.length} 班<span class="mt">新生 ${sum(rows)}・總人數 ${cur(rows)}</span></td></tr>`;
    rows.forEach(c=>{ const [cy,cm,cd] = c.open.split("/").map(Number), w = where(c);
      h += `<tr><td class="d">${cm}/${cd}（${DOW[new Date(cy,cm-1,cd).getDay()]}）</td>`
        + `<td class="cn">${esc(c.name)}${memoOf(c.tid).map(m=>`<span class="dm">備註：${esc(m)}</span>`).join("")}</td>`
        + `<td>${catTag(w.cat)}</td><td class="rm">${esc(w.room||"")}</td>`
        + `<td>${esc(c.teacher)}</td><td class="n">${c.new}</td><td class="n">${c.current}</td><td>${badge(c)}</td></tr>`; });
  });
  h += `</tbody><tfoot><tr><td colspan="5">合計 ${cls.length} 班</td><td class="n">${sum(cls)}</td><td class="n">${cur(cls)}</td><td>未填寫 ${miss} 班</td></tr></tfoot></table>`;
  $("openTable").innerHTML = h; $("openCard").hidden = false;
}
// 專班線規劃（Google 試算表「中壢課表」）：依今天標出已結訓／上課中／下一門，並比對系統排課有沒有同日開課、同講師的課
function renderTracks(){
  const T = META.tracks; if (!T || !T.tracks || !T.tracks.length) return;
  const today = META.today, md = s => { const [y,m,d] = s.split("-").map(Number); return `${m}/${d}`; };
  const first = {};   // 系統排課：每門課第一堂的日期 → [講師…]
  DATA.forEach(d=>{ if (d.plan) return;   // 虛線預排（規劃中）不是系統的課，不能算已上架
    if (!first[d.tid] || d.date < first[d.tid].date) first[d.tid] = d; });
  const byDate = {}; Object.values(first).forEach(d=>(byDate[d.date] ||= []).push(d));
  // 比對系統排課：同一天開課＋同講師 → "ok"；系統講師是「專業講師群」「未定」這類未指定的 → "noteacher"；找不到 → ""
  const NOT_SET = /講師群|未定|待聘/;
  const inSys = (c,t) => { if (c.tid && first[c.tid]) return {k: NOT_SET.test(first[c.tid].teacher||"") ? "noteacher" : "ok", tid:c.tid};   // 已對到系統班級
    const ts = (c.teacher || t.teacher || "").split(/[、,，\s]+/).filter(Boolean), ds = byDate[c.open]||[];
    const hit = ds.find(d=>!NOT_SET.test(d.teacher||"") && (!ts.length || ts.some(n=>(d.teacher||"").includes(n))));
    if (hit) return {k:"ok", tid:hit.tid};
    const nt = ds.find(d=>NOT_SET.test(d.teacher||""));
    return nt ? {k:"noteacher", tid:nt.tid} : {k:"", tid:null}; };
  const CNT = T.counts || {};
  const cnt = tid => { const n = tid && CNT[tid]; return n ? `<span class="pc" title="新生 ${n[0]} 人・總人數 ${n[1]} 人（${esc(T.counts_fetched||"")}）">新生 <b>${n[0]}</b>・總 <b>${n[1]}</b></span>` : ""; };
  const days = (a,b) => (new Date(b) - new Date(a)) / 864e5;
  let nNow = 0, nMiss = 0, nNoT = 0, h = "", year = null;
  T.tracks.forEach(t=>{
    const cs = t.courses, st = cs[0].open, en = cs.reduce((m,c)=>c.end>m?c.end:m, cs[0].end);
    const nextI = cs.findIndex(c=>c.open > today);
    const done = en < today, pct = done ? 100 : today < st ? 0 : Math.round(days(st,today) / Math.max(1,days(st,en)) * 100);
    if (t.year !== year) { h += (year===null ? "" : "</div>") + `<h3 class="tkyear">${t.year ? t.year+" 年開課" : "其他"}</h3><div class="tkgrid">`; year = t.year; }
    h += `<div class="tk${done?" done":""}"><h3>${esc(t.name)}</h3>`
      + `<div class="tm"><span>${esc(t.slot)}</span><span>· ${esc(t.teacher)}</span><span>· ${md(st)} ～ ${md(en)}</span>${done?"<span>· 已結束</span>":""}</div>`
      + `<div class="rail" title="進度 ${pct}%"><i style="width:${pct}%"></i></div><ol>`;
    cs.forEach((c,i)=>{
      const cls = c.end < today ? "past" : c.open <= today ? "now" : i===nextI ? "next" : "";
      if (cls==="now") nNow++;
      let b = "";
      const m = cls==="past" ? {k:"", tid:null} : inSys(c,t), pc = cnt(m.tid);
      if (cls==="now") b = `<span class="badge ok">上課中</span>`;
      else if (cls==="past") b = `<span class="badge na">已結束</span>`;
      else { const k = m.k; if (!k) nMiss++; if (k==="noteacher") nNoT++;
        b = k==="ok" ? `<span class="badge ok">已上架</span>`
          : k==="noteacher" ? `<span class="badge no" title="系統已上架，但講師是「專業講師群」等未指定">講師未設定</span>`
          : `<span class="badge na">未上架</span>`; }
      const span = c.open===c.end ? md(c.open) : `${md(c.open)} ～ ${md(c.end)}`;
      const sx = [c.slot && c.slot!==t.slot ? c.slot : "", c.teacher && c.teacher!==t.teacher ? c.teacher : "",
                  c.skip ? "停課 " + c.skip : ""].filter(Boolean).join(" · ");
      h += `<li class="${cls}"><span class="dot"></span><span><span class="cn">${esc(c.name)}</span><span class="dr">${span}${pc}</span>${sx?`<span class="sx">${esc(sx)}</span>`:""}</span>${b}</li>`;
    });
    h += `</ol></div>`;
  });
  h += "</div>";
  const active = T.tracks.filter(t=>t.courses.some(c=>c.end >= today)).length;
  $("trackSrc").textContent = `最後更新 ${T.updated || ""}`;
  $("trackSum").innerHTML = `<div class="kpi"><b>${T.tracks.length}</b><span>專班線</span></div>`
    + `<div class="kpi"><b>${active}</b><span>進行中／未開始</span></div>`
    + `<div class="kpi"><b>${nNow}</b><span>目前上課中</span></div>`
    + `<div class="kpi ${nNoT?"warn":""}" title="系統已上架，但講師是「專業講師群」等未指定"><b>${nNoT}</b><span>講師未設定</span></div>`
    + `<div class="kpi ${nMiss?"warn":""}" title="規劃中還沒開課的課，在系統排課表找不到同一天開課、同講師的課程"><b>${nMiss}</b><span>未上架</span></div>`;
  $("trackBody").innerHTML = h; $("trackCard").hidden = false;
}
renderOpenings();
renderTracks();
if (META.planPreview) {
  const n = new Set(DATA.filter(d=>d.plan).map(d=>d.tid)).size;
  $("planBar").innerHTML = `<b>規劃預覽（只在本機，不會發布）</b>　虛線框＝專班線上還沒在系統上架的 ${n} 門課，依時段推算每一堂（已跳過國定假日與停課日）；還沒選教室的課列在「規劃・未定教室」。搜尋「規劃」可以只看這些課。`;
  $("planBar").hidden = false; document.title = "規劃預覽｜" + document.title;
}
$("goOpen").onclick = ()=> $("openCard").scrollIntoView({behavior:"smooth", block:"start"});
$("goTracks").onclick = ()=> $("trackCard").scrollIntoView({behavior:"smooth", block:"start"});
if (!META.openings) $("goOpen").hidden = true;
if (!META.tracks) $("goTracks").hidden = true;
$("slot").onchange=render; $("q").oninput=render;
const qs = new URLSearchParams(location.search).get("start");
show(okDate(qs) ? qs : DEFAULT_START, true);
// 嵌在專班線規劃編輯器裡（?embed=1）：只留行事曆；編輯器每次修改都送來最新規劃，即時重畫
if (META.planPreview && new URLSearchParams(location.search).get("embed")) {
  document.body.classList.add("embed");
  let lastFocus = "", lastCat = null;
  addEventListener("message", e => {
    if (e.origin !== location.origin || !e.data || e.data.type !== "plans") return;
    const n = applyPlans(e.data.tracks), f = e.data.focus, sl = $("sc").scrollLeft;
    if (e.data.cat !== undefined && e.data.cat !== lastCat) { lastCat = e.data.cat; $("slot").value = e.data.cat; lastFocus = ""; }   // 只看正在排的時段
    $("planBar").innerHTML = `<b>預排顯示</b>　虛線框＝編輯器裡還沒上架的 ${n} 門課（即時更新，尚未存檔的也會顯示）`;
    setWindow($("start").value); render(); $("sc").scrollLeft = sl;
    if (f && f !== lastFocus) {   // 正在編輯的課：跳到它的開課日，並捲到那門預排課程所在的列
      lastFocus = f;
      if (f < $("start").value || f > END_ISO) show(f.slice(0, 8) + "01", true);
      const x = dayIdx(f) * COL;
      const cell = [...document.querySelectorAll(".cell.plan")].sort((a, b) => Math.abs(parseFloat(a.style.left) - x) - Math.abs(parseFloat(b.style.left) - x))[0];
      if (cell) { const sc = $("sc"), row = cell.closest(".row");   // 捲動行事曆內部，表頭（月份／日期）仍固定在上面
        sc.scrollTop = Math.max(0, row.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 100); }
      $("sc").scrollLeft = Math.max(0, x - 160);
    }
  });
  parent.postMessage({type:"calendar-ready"}, location.origin);
}
</script>
</body>
